spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}

aws.region=${AWS_REGION:eu-west-3}
aws.s3.bucket=${AWS_S3_BUCKET:hei-transcripts}
aws.ses.source=${AWS_SES_SOURCE:noreply@hei.school}
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL:}

app.events.transport=${APP_EVENTS_TRANSPORT:sqs}
