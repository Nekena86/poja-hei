# Test profile: every test runs against a throwaway PostgreSQL container, so nothing
# ever touches the shared Neon database. TC_DAEMON keeps one container alive for the
# whole test run instead of starting one per test class.
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///hei?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.flyway.url=jdbc:tc:postgresql:16-alpine:///hei?TC_DAEMON=true
spring.flyway.user=test
spring.flyway.password=test
spring.flyway.baseline-on-migrate=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


app.events.transport=local
aws.region=eu-west-3
aws.s3.bucket=test-bucket
aws.ses.source=noreply@test.local
aws.sqs.queue-url=
